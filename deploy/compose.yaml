services:
  # owns the shared netns, so a gateway restart does not strand the hub in a dead one
  netns:
    image: registry.k8s.io/pause:3.10
    restart: unless-stopped
    sysctls:
      net.ipv4.ip_forward: "1"
    ports:
      - "${HUB_PORT:-8080}:8080/tcp"
      - "${UNDERLAY_PORT:-51820}:51820/udp"
      - "${CLIENTS_PORT:-51821}:51821/udp"
  gateway:
    build:
      context: ..
      dockerfile: deploy/gateway.Dockerfile
    restart: unless-stopped
    network_mode: service:netns
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun]
    volumes:
      - ovn:/var/lib/ovn
      - ovs:/etc/openvswitch
      - data:/data:ro
  hub:
    build:
      context: ..
      dockerfile: deploy/hub.Dockerfile
    restart: unless-stopped
    network_mode: service:netns
    environment:
      HUB_PORT: ${HUB_PORT:-8080}
      UNDERLAY_PORT: ${UNDERLAY_PORT:-51820}
      CLIENTS_PORT: ${CLIENTS_PORT:-51821}
    command: ["-config", "/data/hub.json", "-ssh-dir", "/host-ssh"]
    volumes:
      - data:/data
      - ${HUB_SSH_DIR:-~/.ssh}:/host-ssh:ro
  storage:
    build:
      context: ..
      dockerfile: deploy/storage.Dockerfile
    profiles: [storage]
    restart: unless-stopped
    ports:
      - "${STORAGE_PORT:-10809}:10809/tcp"
    environment:
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
    command: ["-hub", "ws://netns:8080/api/storage/connect", "-token-file", "/data/hub.json"]
    volumes:
      - disks:/disks
      - data:/data:ro
volumes:
  ovn:
  ovs:
  data:
  disks:
