<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vm-manager</title>
    <script>
      // Set before first paint to avoid a light flash; App.vue owns the same key.
      try {
        var t = localStorage.getItem('vmm-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t === 'dark' ? 'plinth-dark' : 'plinth';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
